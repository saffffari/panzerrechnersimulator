[package]
name = "pixelkpfw"
version = "0.1.0"
edition = "2021"
description = "pixel.Kpfw — a mini dither/pixelate workbench (the Kessel crush effect, with sliders)"

[[bin]]
name = "pixelkpfw"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Keep our own code quick to compile but optimise the GUI stack so the live preview is smooth.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
