[platformio]
default_envs = teensy41

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_unflags =
  -std=gnu++14
build_flags =
  -std=gnu++17
  -O3
  -ffast-math
monitor_speed = 115200

[env:teensy41_wash]
extends = env:teensy41
build_flags =
  ${env:teensy41.build_flags}
  -DKESSEL_TFT_COLOR_WASH=1
